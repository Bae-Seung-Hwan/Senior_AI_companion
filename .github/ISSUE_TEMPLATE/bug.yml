name: 버그 신고
description: 잘못 동작하는 부분을 알립니다
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: 기기 / OS / 앱 버전
