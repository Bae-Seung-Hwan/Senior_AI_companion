name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 바뀐 경로를 보고 필요한 검사만 돌린다
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      tools: ${{ steps.filter.outputs.tools }}
      app: ${{ steps.filter.outputs.app }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - '**/*.md'
              - '.github/scripts/check_md_links.py'
            tools:
              - 'tools/**'
            app:
              - 'app/**'
            server:
              - 'server/**'

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 문서 링크 검사
        run: python .github/scripts/check_md_links.py .

  tools:
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 린트 (ruff)
        run: pipx run ruff==0.17.6 check tools/  # 버전마다 기본 규칙이 달라져서 고정
      - name: JSON 형식 검사
        run: |
          find tools -name '*.json' -not -path '*/results/*' -print0 \
            | xargs -0 -n1 python -m json.tool --no-ensure-ascii > /dev/null
      - name: mock 테스트
        run: python -m unittest discover tools/mocks

  # 기술 스택(#1) 확정 후 채운다. app/ 폴더가 생기기 전에는 건너뛴다
  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo '앱 검사는 기술 스택 확정 후 추가 (린트, 타입, 테스트, 빌드)'

  # 기술 스택(#1) 확정 후 채운다. server/ 폴더가 생기기 전에는 건너뛴다
  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo '서버 검사는 기술 스택 확정 후 추가 (린트, 타입, 테스트)'

  # 브랜치 보호에서 이 job 하나만 필수로 지정한다.
  # 건너뛴 job은 통과로 보고, 실패하거나 취소된 job이 있으면 실패한다.
  ci-ok:
    needs: [changes, docs, tools, app, server]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 실패한 검사 있음
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "모든 검사 통과"
